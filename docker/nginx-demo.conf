# /etc/nginx/sites-available/demo.focinhos.pt  (then: ln -s into sites-enabled, certbot --nginx)
# The zones sit outside server{}: sites-enabled files are included in the http context.
limit_req_zone $binary_remote_addr zone=focinhos_demo_all:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=focinhos_demo_start:10m rate=2r/m;

server {
    listen 80;
    server_name demo.focinhos.pt;

    client_max_body_size 12m;

    access_log /var/log/nginx/demo.focinhos.pt.access.log;
    error_log  /var/log/nginx/demo.focinhos.pt.error.log;

    limit_req zone=focinhos_demo_all burst=40 nodelay;
    limit_req_status 429;

    # "Try the demo" button (the app also throttles to 6/hour per IP).
    location = /demo {
        limit_req zone=focinhos_demo_start burst=3 nodelay;
        include /etc/nginx/focinhos-demo-proxy.conf;
    }

    location / {
        include /etc/nginx/focinhos-demo-proxy.conf;
    }
}
